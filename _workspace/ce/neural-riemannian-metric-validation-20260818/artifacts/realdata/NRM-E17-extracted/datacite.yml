# A title to describe the published resource.
title: "Tuft dendrites in frontal motor cortex enable flexible learning"

# Additional information about the resource, e.g., a brief abstract.
description: "This repository contains behavioral, electrophysiological, functional imaging (two-photon calcium and glutamate imaging), and chemogenetic/optogenetic data that support our findings on the role of apical tuft dendrites of layer 5b pyramidal neurons in the anterolateral motor cortex (ALM) during flexible learning. The dataset includes data from a rule-switching behavioral paradigm, NDNF interneuron manipulations, dendritic calcium imaging, synaptic glutamate imaging, and Neuropixels recordings."


