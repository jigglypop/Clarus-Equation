[package]
name = "nrm3d-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
blake3 = "1.8"
nalgebra = "0.33"
rand_chacha = "0.9"
rand_core = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
