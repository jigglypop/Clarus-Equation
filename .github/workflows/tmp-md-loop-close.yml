name: Temporary MD Loop Close
on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-md-loop/**'
      - '.github/workflows/tmp-md-loop-close.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/md-loop-close-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas openpyxl requests
      - run: python .tmp-md-loop/inspect_source.py
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f md_loop_results/inventory.json md_loop_results/inventory.md
          if git diff --cached --quiet; then echo nochanges; else git commit -m 'test: record MD source inventory'; git push origin HEAD:tmp/md-loop-close-20260819; fi
