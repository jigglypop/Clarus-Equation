name: Temporary Neural Routing Direct Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp-neural-routing/**'
      - '.github/workflows/tmp-neural-routing-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/neural-routing-direct-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run official PFC analysis
        run: python .tmp-neural-routing/run_analysis.py
      - name: Commit machine results to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f routing_direct_results/results.json routing_direct_results/report.md
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'test: record temporary official PFC routing results'
            git push origin HEAD:tmp/neural-routing-direct-20260819
          fi
