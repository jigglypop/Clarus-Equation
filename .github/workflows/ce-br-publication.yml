name: CE artifact publication
on:
  push:
    branches: [main]
    paths: ['artifacts/ce_br_publication_2026-09-15/ready.json']
permissions:
  contents: write
concurrency:
  group: ce-br-publication
  cancel-in-progress: false
jobs:
  import-verified-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify original files
        run: python3 tools/ce_restore_publication.py --repo . --ready artifacts/ce_br_publication_2026-09-15/ready.json
      - name: Install focused verification dependencies
        run: python3 -m pip install numpy scipy sympy pytest
      - name: Run the five focused regression suites
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -B -m pytest -p no:cacheprovider -q verify/test_ce_br3_packet_channels.py verify/test_ce_br4_visible_forward.py verify/test_ce_br5_realtime.py verify/test_ce_br6_autonomous.py verify/test_ce_br7_nonlinear.py
      - name: Publish verified files without rewriting history
        env:
          CE_EXPECTED_HEAD: ${{ github.sha }}
        run: python3 tools/ce_restore_publication.py --repo . --ready artifacts/ce_br_publication_2026-09-15/ready.json --commit-and-push
