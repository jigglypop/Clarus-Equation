name: Temporary E17 Direct Inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp-e17/**'
      - '.github/workflows/tmp-e17-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/neural-routing-direct-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy h5py
      - name: Inventory official E17 archive
        run: python .tmp-e17/inspect_archive.py
      - name: Commit inventory to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f e17_direct_results/inventory.json e17_direct_results/report.md
          if git diff --cached --quiet; then
            echo 'No inventory changes'
          else
            git commit -m 'test: record temporary E17 archive inventory'
            git push origin HEAD:tmp/neural-routing-direct-20260819
          fi
