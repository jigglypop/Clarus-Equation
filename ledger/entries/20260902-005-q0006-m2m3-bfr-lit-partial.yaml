  (adversary 지위 감사).

  M3 = [미완성] — 채택 틀은 BFHPR 2016(arXiv:1605.02573)이 아니라 BFR 2016(arXiv:1306.1058)
  일반 틀(정의)이다(adversary 정정; §2 원 문구의 출처 라벨은 기각). 유도 자체가 채택한 4조건
  (a) 공변 partial observable 스칼라 4개, (b) 배경 근방 단사성 det(∂_μX^A)≠0, (c) 섭동적
  BV 구성에서 QME 해결, (d) 선형화 게이지 고정계의 Hadamard 상태 중 (a)만 충족한다. (b)는
  요청의 "E58"=정본 E61-D형 상수-X̄ 평탄 배경에서 det=0으로 실패하고, 요청의 "E59"=정본
  E62-A 비퇴화 FLRW 국소 patch에서만 det=μ_X⁴u a³b³≠0 (uβ≠0)으로 조건부 국소 통과한다
  (E78은 정본에 없다). (c)(d)는 미검증이다. 따라서 "BFR 클래스 안"이라고 뭉뚱그려 쓰지 않고
  "(a) 충족, (b) 배경 조건부, (c)(d) 미검증"으로만 좁혀 쓴다. 채택한 (a)–(d) 목록에는 BFR의
  배경 독립성 조건이 빠져 있었다(adversary 지적, 이번 attempt에서 보강하지 않음). BFHPR
  2016의 "external fields ... not useful ... because these fields would appear in the
  final gauge-invariant expressions"는 우주론 섭동론 목적에 상대적인 판단이지 불가능 판정이
  아니며, CE는 X^A를 물질로 선언했으므로 최종식에 남는 것이 의도된 특징이다 — 다만 BFHPR의
  배경(inflaton FLRW)·기준 좌표(비국소 조화)·관측량 대수는 M1과 다르므로 BFHPR 결과의 직접
  이전이 아니다. M1 적응에서 새로 증명해야 할 것(P1–P6): P1 X^A 요동의 dressed 관측량 대수
  기여와 고정 배경 극한의 억제 조건, P2 강결합 스케일 Λ_sc(μ_X,M_P)와 EFT 유효 영역, P3 E62
  patch 전역 쌍곡성+선형화 게이지 고정계 normal hyperbolicity+Hadamard 존재, P4 국소 단사→
  patch 덮개·gluing(compact Σ 대 noncompact rod X^i=βx^i 충돌 해소), P5 dressing·edge/
  boundary sector 명세, P6 M1 field content에서 QME 해결(M2와 공유) — 여섯 항목 모두 미증명.

  M2 = [미완성: 미통과 유지] — 하위 항목만 [정리: 외부 기존]으로 생존한다: 4D 공변 미분동형
  BRST 이상항 부재는 Alvarez-Gaumé–Witten 1984 차원 정리(중력 이상항은 d=4k+2 카이럴 장에만,
  4∉{4k+2})와 hep-th/0404033의 명시 문장("there are no field-theoretic diffeomorphism
  anomalies", 4D)으로 뒷받침되나, 보손 물질 전용 명시 문장은 미확인이고 국소 BRST cohomology
  H¹(s|d)(ghost number 1) 계산 출처가 없다. 36장 식 (36.7) 정준 HDA 이상항과 공변 BV/QME
  이상항의 동치, M1 field content에서 QME 해결 가능성(재규격화 조건·EFT truncation·GHY 경계항),
  그리고 E54-H1이 요구하는 양의 물리 내적이 이 동치에서 자동으로 따라오는지는 모두 미증명이며
  탈락 표시한다(adversary). "Bardeen–Zumino 항상 가능" 문장은 무출처로 확인되어(adversary
  P2) 이 기록에서는 주장으로 유지하지 않는다.

  프론티어 M4로의 "이동"은 36장 173행("각 마일스톤은 전 단계가 통과했을 때만 시작한다")·
  QNB-E54-H4("M3--M9에는 진입하지 않는다")와 충돌한다 — M3는 dressing·edge 미정의(P5)로 아직
  중단 조건 경계에 있다. 사용자의 명시적 재선언(규칙 단서 추가 또는 E54-H4 개정) 없이 M4 작업을
  시작하면 규칙 위반이다. M4 착수에 실제 필요한 최소 전제만 추리면 A1(E62형 국소 patch 고정),
  P4의 국소부(전역부는 불필요), P5(dressing 차수 명세, 전체 사양은 불필요), 정의 수준 선언(자유
  Weyl C*-완비화 또는 ħ-절단 중 택일), tree-level 관계적 대수의 존재, P3을 "임의의 ω"가 아니라
  조건부 존재로 좁힌 형태, E37-D 금지 규칙의 편입이다 — P2, P1(승격 주장이 아니면), P6 full
  QME, P4 전역부, BFHPR 특수 구성, M2 항목 전부는 M4 착수에 불필요하다.

  Q-0006 자체의 진전 종류: 축소(M2·M3 도입 경로를 "문헌 도입 여부의 이분법적 판정"에서 "BFR
  일반 틀 채택(정의)+ 적응 목록 P1–P6 + M4 조건부 준비 전제 A1/P4국소/P5/정의수준"으로 좁힘).
  닫힘·승격이 아니다.
