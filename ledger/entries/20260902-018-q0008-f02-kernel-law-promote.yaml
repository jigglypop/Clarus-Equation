claim: |-
  사다리 3단(커널 법칙, 카드 F-02)을 promote로 닫는다: 2단 정확 항등식(E-20260902-008)과
  Isserlis/Wick 전개로 $\bar\epsilon^2:=E[\epsilon^2]=\epsilon_\star^2\,\lVert H\kappa H\rVert_F^2/n^2\,(1+O(\delta^2))$,
  $\epsilon_\star^2=2T_2\delta^4/\lVert G_0\rVert_F^2=10\,\delta^4$($T_2=60$·$\lVert G_0\rVert^2=12$는
  Q-0012 a1의 sympy 정확 유리수 구조상수; 가우스와 i.i.d. 분기가 하나의 $\epsilon_\star$를 공유해 E-20260902-015의
  hidden assumption을 해소한다). 평균 바닥 없음($E[\mathrm{tl\,gram}\,Y]=0$)은 SO(4) 켤레 등변성
  $\xi\mapsto\Lambda\xi\Lambda^{\top}$ + Schur로 모든 $\delta$에서 정확(검사 B, 상대오차 $\le1.2\times10^{-15}$;
  adversary a2가 이 작용이 유일하게 옳은 켤레임을 재확인, 한쪽곱 대안은 0.31~2.89로 배제). 닫힌 식 4종
  ($\lVert HIH\rVert^2=n-1$, 두 종 $4n^2p^2(1-p)^2$, chain $(n^2-1)(2n^2+7)/180$, star $n-2+1/n^2$)과
  교차항 $\mathrm{tr}(H\kappa)=\sum_us_u(1-s_u/n)$, 혼합 가법성을 기호로 증명(훅 23/23; 검사 D $n\le11$
  전수·무작위 대칭 $\kappa$, 최대 상대오차 $8.5\times10^{-16}$; adversary a1 독립 재유도 정확 0).
  $\gamma_{\rm her}=1/d_{\rm tree}$는 **강화된 조건 (C)**: $D(n)/(n^2\,\mathrm{depth}(n)^2)\to\mathrm{const}$
  (정칙변동 — $D/n^2\asymp\mathrm{depth}^2$만으로는 부족함을 adversary가 진동 반례
  $D/n^2=\mathrm{depth}^2(2+\sin\ln n)$, $\gamma\in[0.22,0.78]$로 보임)이고 $\mathrm{depth}\asymp n^{1/d_{\rm tree}}$인
  족의 조건부 따름정리이며, 유도가 다룬 6족(chain·caterpillar$\to1/90$, 균등 Cayley·star-of-chains의
  강한 재해석 $\to1/6$, star, balanced binary)이 모두 강한 형태를 만족한다. $O(\delta^4)$ 절단의 닫힌 상계는
  유도하지 않았다 — 실측 상계뿐(이 attempt의 $\delta$ 3점 시험 $|\tau(0.005)|\le0.026\%$, adversary의
  attempt-04 공통난수 재해석 상계 $0.17$–$0.23\%$; (S10.5) 정직 기록). 검사 C-b(물리 MC 2000 trial, 5% 창)는
  선언대로 **미통과(2/12 창 밖)**로 기록하되, adversary 독립 seed(424242, 8000 trial) 재실행에서 편차가
  소멸함을 확인해(i.i.d. $n{=}2$ $+1.34\%$/$z{=}{+}1.02$, 두 종 $n{=}8$ $+0.28\%$/$z{=}{+}0.21$) 원인이
  법칙의 결함이 아니라 검정력 부족(rank-1 사례의 5% 창은 $1.97\sigma$, 법칙이 참이어도 $\ge2/12$ 창밖
  확률 $7.2\%$)임을 판정했다. status pass, P0 없음.
