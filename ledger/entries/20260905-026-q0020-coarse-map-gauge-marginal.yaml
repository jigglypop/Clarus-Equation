  definitions:
    - '[정의] 가능 이력은 허용된 전이의 연쇄이며, 사건은 특정 이력에서 기록으로 구별되는 전이다. 모든 가능성을 같은 물리 시간에 이미 실현된 것으로 동일시하지 않는다. 실현·선택의 물리 법칙은 별도 증명 의무다.'
    - '[정의] 계산 인덱스·구적 인덱스·재귀 깊이는 물리 시간이 아니다. 여기서 tau는 먼저 순서를 표시하는 실수값 함수이며 물리 시계가 아니다.'
  conditional_results:
    - status: '[정리: 조건부]'
      claim: '유한 유향 그래프의 모든 변 a->b에서 tau(a)<tau(b)인 함수가 존재할 필요충분조건은 유향 순환이 없는 것이다. 순환은 엄격 부등식의 모순을 주고, 비순환 그래프는 위상 정렬의 순번을 tau로 삼을 수 있다.'
    - status: '[정리: 조건부]'
      claim: '상태만의 그래프에 분할과 역병합을 양방향 변으로 넣으면 상태에만 의존하는 엄격 단조 tau는 없다. 이것은 가역 전이 또는 시간의 존재 자체를 기각하지 않는다. 같은 상태로 돌아와도 기록 R0!=R2이면 (C0,R0)->(C1,R1)->(C0,R2)의 사건들은 다르므로 상태 순환과 사건 순환을 구별해야 한다.'
  boundaries:
    - '[공리] 공간 차원이 0이라는 것만으로 무시간이 따라오지는 않으므로 무시간성을 독립적으로 채택한다.'
    - '[미완성] 로런츠 부호·스칼라 시계·T·9/74 응답은 출현 후에 공급한 유효 모형의 자료이며 0D의 시간 발생 증거로 역대입하지 않는다.'
  next_proof_link:
    - '[미완성] 분할·보존 기록이 만드는 사건들의 비순환 부분순서와 그 물리적 발생을 유도한다. 순서 함수에서 시계 척도·고유시간·계량으로 가는 추가 고리를 증명한다.'
    - '[미완성] 기록의 에너지 비용·유한 자원·환류를 포함해 같은 작용의 인과적 응답과 출현 후 중력 검증을 잇는다. 전체 목표·여덟 성공 게이트·F-01 기각을 유지한다.'

