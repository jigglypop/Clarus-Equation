regge_scalar_source:
  status: '[산출]'
  target_link: '외부 j를 공급하던 고리에서 같은 단체의 스칼라 작용으로 원천과 기하·장 경계 운동량을 함께 계산하고, 에너지·시간 유도로 갈 입력을 판별한다.'
  scope: 'h=1의 네 유클리드 4-단체, 공유 무차원 길이 15개와 꼭짓점 장 6개다. 총작용 s=beta R+kappa S_phi, beta,kappa>0, S_phi=1/2 sum V Delta_phi^T G^-1 Delta_phi를 공급한다. 장도 기준척도로 나눈 무차원 변수다.'
  axioms:
    - '[공리: 검증 모형] 질량 없는 스칼라의 단체별 선형 보간과 V=sqrt(det G)/24를 택한다. 같은 규칙을 old/middle/final 및 추가 두 단체에 각각 적용한다. 기존 공유 계량과 경계 준비의 물리적 기원은 미유도다.'
    - '[공리: 검증 모형] phi_0=m-v/2, phi_1=m+v/2, phi_2,...,phi_5=0의 경계 자료를 공급한다. 생성·병합에서 장의 값은 유지하고 그 경계 운동량을 전체 작용 증분으로 갱신한다.'
  definitions:
    - '[정의] L=2sqrt(10)/3, r=sqrt(40/9-e^2), d=sqrt(3)r/(9e), b=4sqrt(3)e/(9r), 0<e<L다. 이 경계 준비에서는 T(e)=S_phi=(d v^2+b m^2)/2다.'
    - '[정의] eta=sqrt(kappa/beta)|v|, zeta=m/v는 v!=0에서 정의한다. j_eff(e)=-kappa T_e/beta이고, 외부 독립 원천과 달리 같은 기하의 함수다.'
    - '[정의] A_tot=beta A+kappa A_phi, B_tot=beta B+kappa B_phi, c_tot=p_y-(A_tot)_y, F_tot=p_e+(B_tot)_e, a_tot=-(A_tot+B_tot)_{ey}다. 길이 미분에서 꼭짓점 장은 고정한다.'
  conditional_results:
    - status: '[정리: 조건부]'
      claim: '각 단체에서 det G=4e^2r^2/3, V=e sqrt(3)r/36, Delta_phi^T G^-1 Delta_phi=v^2/e^2+4m^2/r^2다. 네 항을 더하면 T=(d v^2+b m^2)/2를 얻는다.'
    - status: '[정리: 조건부]'
      claim: '초기 전체 경계 위상 p_old=d(beta R_old+kappa S_phi,old)를 준비하면 p_middle=p_old+dA_tot, p_final=p_middle+dB_tot이다. 생성 제약 c_tot=0과 병합 제약 F_tot=beta R_e+kappa T_e=0이 함께 따른다. 스칼라 경계 운동량 pi_phi=kappa K phi도 합성한다. kappa=0이면 원래 중력 관계를 복원한다.'
    - status: '[정리: 조건부]'
      claim: '고정 |zeta|<1/6, eta->0+에서 e_pm=2 +/- sqrt(5(1-36zeta^2)) eta/36 +(-5/1728-85zeta^2/144) eta^2+O(eta^3)다. 전체 제약 괄호는 a_tot^2/(beta kappa v^2)->5(1-36zeta^2)/18이다. 경계 원뿔에 가까워질 때 균일한 근사로 주장하지 않는다.'
    - status: '[정리: 조건부]'
      claim: '고정 |zeta|>1/6이면 e=2로 접근하는 작은 eta의 정상 가지가 없다. v=0,m!=0이면 R_e>=0와 b_prime>0 때문에 열린 허용구간 전체에 정상근이 없다. |zeta|=1/6이면 e=2가 정확근이며 다른 근은 e=2-25 eta^2/648+O(eta^4)다.'
    - status: '[정리: 조건부]'
      claim: '연결된 양의 그램 복합체에서 모든 꼭짓점 장을 자유변분해 K phi=0이면 S_phi=0이고 phi는 공통 상수다. 비영 원천은 경계 준비 또는 다른 동역학을 필요로 한다. sum pi_phi=0은 장의 상수 이동 항등식이며 에너지 보존식이 아니다.'
    - status: '[정리: 조건부]'
      claim: '실수 beta,kappa,v,m에서 두 정규화 측도의 전체 K=integral rho exp(i beta R+i kappa T) de는 절댓값<=1이고 매개변수에 연속이다. 길이측도 rho=1/L, 고정 v!=0에서 kappa->0+이면 K_kappa-K_0=i sqrt(3)v^2 exp(i beta R(0)) kappa log(1/kappa)/18+O(kappa), R(0)=8sqrt(3)pi/3다. 따라서 kappa=0의 유한 첫 미분과 복소 전체함수 성질을 갖지 않는다.'
    - status: '[정리: 조건부]'
      claim: '제곱길이 측도 rho=2e/L^2에서는 integral rho T가 유한하므로 kappa=0의 첫 미분은 i integral rho T exp(i beta R) de다. 길이측도의 로그계수 수치와 구별하며 이 미분의 수치 검산은 수행하지 않았다.'
  proof: 'derivations/Q-0020/conditional_composition.derivation.md#스칼라-원천과-기하의-상호-응답'
  numerical_results:
