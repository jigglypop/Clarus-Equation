  definitions:
    - '표준 Borel 확률공간에서 P_s(v)=int exp(i beta s)v dmu, I psi=psi(f), K=E_mu[exp(i beta s)|f]다. 실수 가측 상위 작용 t와 J_j psi=j psi(f)를 두며, 모든 경계 함수에 대한 등거리는 E_mu[|j|^2|f]=1이다.'
    - '독립 미분 대조는 열린 절단의 콤팩트 지지에서 D=-i partial_e, 제곱길이 측도에서는 D=-i(partial_e+1/(2e))다. 중력 제약이나 전체 자기수반 도메인으로 선언하지 않는다.'
  conditional_results:
    - status: '[정리: 조건부]'
      claim: '자연 삽입의 유도 진폭은 K다. 실수 t의 순수위상과 모든 경계 상태에서 일치할 필요충분조건은 K=exp(i beta t) nu-a.e.다. 이때 조건부 위상이 거의 확실히 일정해야 한다.'
    - status: '[정리: 조건부]'
      claim: 'E[|j|^2|f]=1이고 E[exp(i beta s)j|f]=exp(i beta t)이면 조건부 Cauchy–Schwarz 등호로 j=exp(i beta(t-s))가 a.e. 유일하다. 임의 실수 가측 t에 이 삽입이 존재한다. 경계 곱셈 보존·등거리·가환 투영망의 끝점 작용차 합성도 성립하므로 이 조건들은 t를 선택하지 못한다.'
    - status: '[정리: 조건부]'
      claim: '강제 삽입과 자연 삽입의 조건부 거리 제곱은 d_t^2=2-2Re[exp(i beta t)conj(K)]다. beta!=0이면 min_t d_t^2=2(1-|K|)이며 K=0에서 모든 목표 위상이 동률이다. beta=0에서는 j=1, d=0이다.'
    - status: '[정리: 조건부]'
