      claim: '작용 증분에서 p_prime_e=p_e+partial_e Delta s, p_y=partial_y Delta s가 따른다. 이 새 운동량 제약면 위에서 직전 생성을 역제거하면 원래 길이·운동량을 복원한다.'
    - status: '[정리: 조건부]'
      claim: '정규화한 chi마다 J_chi^dagger J_chi=I이고 J_chi J_chi^dagger는 준비된 섬유 영상으로의 사영이다. 같은 작용과 각 준비의 역복원만으로 chi는 유일하지 않다.'
