  target_link: '응답이라는 사용자 영감을 실제 최종 레게 작용의 외부 원천 응답으로 시험하고, 접힘의 두 가지와 전체 진폭을 함께 남긴다.'
  scope: 'R은 최종 네 단체의 작용이며 기존 S=A+B와 구별한다. 높이 h=1, L=2sqrt(10)/3, 원래 경계 위상 준비 p_old=beta partial R_old를 사용한다.'
  axioms:
    - '[공리: 검증 모형] 무차원 외부 원천 j를 s_j=beta(R-je)로 결합하고 F_j=F-beta j로 둔다. beta>0에서 정류식은 R_e=j다. j의 미시적 기원·에너지·시간은 공급하지 못한 열린 의무다.'
    - '[공리: 검증 모형] 전체 구간의 정규화 측도 rho=1/L 또는2e/L^2를 유지한다. 종교적 응답 비유는 동기이며 물리적 동일성·즉각적 응답·모든 자극에 대한 비영 응답을 전제하지 않는다.'
  conditional_results:
    - status: '[정리: 조건부]'
      claim: '작용의 기존 정확 미분 R_eee=48sqrt(3), R_eeee=720sqrt(3)에서 R_e(2+delta)=24sqrt(3)delta^2+120sqrt(3)delta^3+O(delta^4)다. 충분히 작은 j>0의 두 국소 정상점은 e_+/-=2 +/- sqrt(j/(24sqrt(3)))-5sqrt(3)j/144+O(j^(3/2))다.'
    - status: '[정리: 조건부]'
      claim: '정칙 정상 가지에서 de_+/-/dj=1/R_ee=+/-1/(2sqrt(24sqrt(3)j))+O(1)이다. j=0에는 유한한 선형 역헤시안이 없으므로 그 점의 반응은 비선형 두 가지로 읽는다. 이는 시간 없는 정적 민감도다.'
    - status: '[정리: 조건부]'
      claim: 'a=-beta G_e와 G_ee(2)=6sqrt(2)를 사용하면 a_+/-/(beta sqrt(j))->-/+3^(1/4), a_+/-^2/(beta^2 j)->sqrt(3)다. 공급한 H_square=a^2/2에는 H_square/(beta^2j)->sqrt(3)/2지만 물리적 에너지의 산출은 아니다.'
    - status: '[정리: 조건부]'
      claim: '전체 열린 그램 구간에서 R_e=2(4-e^2)(2pi-3theta)/sqrt(8-e^2), cos(theta)+1/2=3(4-e^2)/(16-3e^2)다. 두 인자의 부호가 같아 R_e>0이고 e=2에서만0이다. 따라서 j<0에는 이 전체 구간의 실수 정상점이 없다.'
    - status: '[정리: 조건부]'
      claim: '초기 준비 p_old=beta partial R_old와 생성 이동의 정준 전달을 함께 쓰면 c=0이고 F_j=beta(R_e-j)다. 원천은 제약면 자체를 바꾸므로 고정 C의 매끄러운 흐름에 대한 계수 비통과 정리와 모순되지 않는다.'
    - status: '[정리: 조건부]'
      claim: 'K_beta(j)=integral rho exp[i beta(R-je)]de는 고정 유한 beta>=0에서 복소 j 전체의 정칙 함수다. 실수 j에서 |K|<=1, |partial_j^n K|<=(beta L)^n이다. 로그미분은 K가 영이 아닌 곳에서만 국소 정의하며 영점 근방의 유계를 주장하지 않는다. beta=0에서는 K=1이고 양의 차수 미분은0이다.'
  proof: 'derivations/Q-0020/conditional_composition.derivation.md#외부-원천의-비선형-응답'
  numerical_results:
    source_sha256: '7e86165028cb4c4d771c4d4ca4b8feaf0e5023bd97d7aba2e8272ca25b30ca33'
    artifacts: 'verify/Q-0020/regge_source_response.json'
    setup: '정상점·원래 제약·a의 수치 검사는 beta=1, j=10^-2,...,10^-6의 두 가지다. 일반 beta 의존성은 정확한 배율 복원식이다. K는 beta=0,1,5,20, j=-.01,0,.01과 두 측도의24조건을 계산한다.'
    branches: '직접 레게 기울기 잔차4.579669976578771e-16, F_j 잔차4.735795089416683e-16, 원천 차분 민감도의 상대오차4.941212453766899e-9 이하다. j=1e-6의 근은1.9998448390374826,2.0001550406812023이고 민감도는-77.61056360153924,77.49028227778714다.'
    asymptotics: 'j=1e-6의 중심 이동 계수는-0.06014065756509979, 정확 계수와 차이는4.524513777526273e-9다. a^2/j는1.729232965124859,1.7348744625119825이며 sqrt(3)과의 최대 차이는 j=.01의0.31402에서 j=1e-6의0.00282366으로 감소한다.'
    kernel: '512/256점 구적 차이는0·1·2차를 합해 최대2.3822415798378985e-11, 원천의 독립 유한 차분은 1차1.0331220632663583e-9,2차5.365195739429459e-7이다.'
    negative_source: '실수 정상점이 없는 j=-.01,beta20에서 |K|는 길이 측도0.11913934577350449, 제곱길이 측도0.22012047713662863이다. 정상점 부재를 전체 진폭 소멸로 해석할 수 없다.'
    limitations: '고정된 두 근 탐색 구간은 검사한 작은 양의 j의 국소 가지용이다. 전역 양의 원천 해 찾기·시간 의존 응답·관측 확률·에너지 보존을 검사한 결과가 아니다.'
  verification:
    symbolic: '정확 테일러 계수·음의 원천 무근 부호·sqrt(3) 배율·전체 적분 정칙성의 독립 수학 검산'
    numeric: pass
    independent_math_audit: pass
    command: '.codex/hooks/python.cmd pytest tests/test_regge_source_response.py -q'
    result: '6 passed in 1.97s; source2 PASS'
  source_boundary:
    - '정상점 합류와 균일 진동 적분의 표준 배경은 NIST DLMF https://dlmf.nist.gov/36.12 다. 제곱근 지수 자체를 새 물리 법칙으로 주장하지 않는다.'
    - '추가 산출은 고정한 실제 R의 원천 의존 두 가지·중심 이동·a^2/(beta^2 j) 계수와 전체 K의 수치 응답이다. 지연 그린 함수나 암흑부문 원천은 미유도다.'
  unfinished:
    - 'j의 자유도·반작용·총에너지를 포함하는 같은 미시 작용을 정하고, 물리 시간·인과적 지연 응답·물리 내적을 도출한다.'
    - '두 길이 가지·전체 커널과 원래 공동 제약의 양립, 접힘 보존·0D 보충·공통 계량·3+1 Plebanski/Einstein·모든 힘·암흑부문·허블 텐션 검증'

regge_joint_energy_flow:
  status: '[산출]'
  target_link: '원래 두 제약의 실제 에너지 적합성을 판정하고, 접힘·분할·병합을 매끄러운 단일 흐름으로 구현할 수 있는 범위를 정한다.'
  scope: '비퇴화 유클리드 네 단체의 공유 무차원 길이 q=(e,y,z13), 실제 두 이동의 c=p_y-beta A_y, F=p_e+beta B_e, S=A+B, G=S_y, a=-beta G_e다. beta는 비영 상수이고 30차원 정준 공간의 공동 제약면 C는 28차원이다.'
  axioms:
    - '[공리: 검증 모형] 무차원 흐름 매개변수 tau와 H/E_star=mathcal_H를 공급한다. 고정 L의 선형 길이 1+e/L, beta G, a^2/2를 비교한다. 물리 시간·에너지 척도·미시 해밀토니안은 미유도다.'
    - '[공리: 검증 모형] 높이 h=.9,1,1.1, beta=1,5의 6점과 작은 e,y,z 변형 3점, beta=1의 세 구성 궤도 tau=0.002를 택한다. 기존 공급 모형의 확장이며 새 CE 물리 후보가 아니다.'
  definitions:
    - '[정의] 정준 이동 p_prime=p+beta dB, Pi=p_z+beta B_z에서 omega_C=dy wedge d(beta G)+sum dz wedge dPi다. a de wedge dy와 beta G_z dy wedge dz 교차항을 모두 유지한다.'
    - '[정의] H_T=mathcal_H+u c+v F에서 제약면 위 승수식은 u={F,mathcal_H}/a, v=-{c,mathcal_H}/a이며 a!=0에서만 나눗셈으로 정의한다.'
  conditional_results:
    - status: '[정리: 조건부]'
      claim: '매끄러운 C에서 닫힌 omega_C와 매끄러운 i_X omega_C=d mathcal_H를 가정하면 L_X omega_C=0, Phi_tau^*omega_C=omega_C다. 국소 흐름이 존재하는 유한 시간에는 rank를 보존하므로 이 C의 rank28 정칙층과 rank26 퇴화층 사이를 통과하지 못한다. 임의의 남은 운동량 의존성을 허용해도 성립한다.'
    - status: '[정리: 조건부]'
      claim: 'a_e!=0인 국소 구역에서 구성공간 에너지 mathcal_H(e,y,z)의 매끄러운 제약 보존 흐름이 존재할 필요충분조건은 a=0 면 전체에서 H_e=H_y=0이다. 이는 국소형 mathcal_H=H0(z)+a^2 k와 동치다. 한 점에서만 미분이 0인 조건이나 전역 분류로 확대하지 않는다.'
    - status: '[정리: 조건부]'
      claim: '국소형의 흐름은 e_dot=2a_y k+a k_y, y_dot=-2a_e k-a k_e, z_dot=0, Pi_dot=beta G_z y_dot-H_z이며 a_dot=a(a_e k_y-a_y k_e)다. 모든 성분을 포함한 매끄러운 연장은 정칙 구역의 흐름으로 정해지며 퇴화면에서 임의의 핵 벡터를 독립적으로 추가할 수 없다.'
    - status: '[정리: 조건부]'
      claim: 'mathcal_H=1+e/L은 a=0에서 {F,mathcal_H}=-1/L을 남기므로 두 제약 보존 승수가 없다. mathcal_H=f(beta G)도 아래 정확한 퇴화점에서 f_prime(beta G)!=0이면 {c,mathcal_H}=-beta f_prime G_y!=0이므로 배제된다. 임계값에서 f_prime=0인 예외는 별도 근방 적합성 검사가 필요하다.'
    - status: '[정리: 조건부]'
      claim: '높이 h=1,e=2,y=sqrt(8/3)에서 Theta_s=pi-2acos(sqrt(15)/5)>0, Theta_r=pi-acos(-4/5)>0이고 G_y=-7sqrt(2)Theta_s/8-5sqrt(3)Theta_r/9-7sqrt(3)/30<0이다. 실제 네 y-삼각형의 면적·이면각 미분과 정확한 그램 역행렬로 계산한다.'
    - status: '[정리: 조건부]'
      claim: '공급한 비음수 mathcal_H=a^2/2는 e_dot=a_y,y_dot=-a_e,z_dot=0,a_dot=0의 매끄러운 흐름을 갖는다. h=1,e=2에서 a_e=-6sqrt(2)beta라 좌표 흐름은 비정지다. a=0에서는 dH=0이므로 전체 벡터는 omega_C의 핵에 속한다. 이것을 물리적 에너지 운동·유일 에너지·공통 계량 선택으로 승격하지 않는다.'
  proof: 'derivations/Q-0020/conditional_composition.derivation.md#공동-제약의-에너지-흐름과-퇴화면'
  numerical_results:
    source_sha256: '60d1ab970f6811e5c7424767e4f964ee5c493c8abeb1d53b5766f935ffe78c66'
    artifacts: 'verify/Q-0020/regge_joint_energy_flow.json'
