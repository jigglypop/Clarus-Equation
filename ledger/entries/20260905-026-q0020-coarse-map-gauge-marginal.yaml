    branch_coefficient: 'eta=.001,zeta=0에서 제곱비0.27768116554125877/0.27787440594998775, 목표5/18, 최대차9.662817220995601e-5다. zeta=1/12의 제곱비0.208248217656128/0.2084185572891313, 목표5/24, 최대차8.522395579796394e-5다.'
    threshold: 'eta=.03,.01,.003에서 -25/648 계수의 절대차는1.0375231655430917e-5,1.1534470848936773e-6,1.0380868400994281e-7이다.'
    endpoint: '길이측도 beta=v=1,m=0에서 로그 복소계수는 -0.0896004514304703-0.0350858712691475i다. kappa=1e-5/1e-6 두 점의 로그 기울기 절대차2.9301236030269173e-6이다. 구적 허용치 변경 차이 최대7.076665845739972e-10, 보고 오차 추정3.7577091068265945e-11이다.'
    limits: '수치 오차 추정은 엄밀 구적 상계가 아니다. 주된 26근은 정규화된 기하 모형의 반응이며 시간 궤도·에너지 보존·물리 원천 준비를 검사하지 않았다.'
