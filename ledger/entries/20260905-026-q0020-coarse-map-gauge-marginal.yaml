    - 'A,B,C는 천막변을 제거한 경계 Hessian의 블록이다. Y는 정점 변위의 길이 미분, e는 Y에 직교하는 단위 벡터다. 길이 섭동 q=e Q, 배경 운동량을 뺀 p의 몫 P=e^T p를 쓴다.'
    - 'p_in=-A q_in-B q_out, p_out=B^T q_in+C q_out. a=e_in^T A e_in, b=e_in^T B e_out, c=e_out^T C e_out.'
