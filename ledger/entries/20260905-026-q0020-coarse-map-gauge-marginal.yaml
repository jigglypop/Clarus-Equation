      claim: '기존 조건부 표적 a=1은 W->infinity에서 lambda=2p(1-p), p=|<1,j_F>|^2다. beta=0의 제곱길이 측도에서 p=8/9, lambda=16/81이므로 영모드 불변성을 일반적으로 주장할 수 없다. p=0,1의 예외는 유지한다.'
    - status: '[정리: 조건부]'
      claim: '영모드 표적 a=j_F와 곱 준비에서는 nu가 폭 alpha=ell/L의 균등 에너지 분포다. phi_nu(k)=exp(i k epsilon_center)sinc(alpha k/2)이고 lambda_W=2 integral dk/(2pi) |eta_hat_W|^2 |phi_nu|^2(1-|phi_nu|^2)>0이다. beta와 두 rho에 독립이며 버퍼 b>1로 양의 배터리 계산과 전체 실선 푸리에 계산이 일치한다.'
    - status: '[정리: 조건부]'
      claim: '사인 배터리의 영모드 표적 누설은 0<lambda_W<=pi^2 alpha^2/(6W^2), W^2 lambda_W->pi^2 alpha^2/6이다. 유한 W의 정확한 원래 F_s 영모드 보존은 이 구성에서 불가능하지만 근사 보존은 개선된다.'
  apparatus_constraint_alternative:
    status: '[공리: 검증 모형]'
    definition: 't=epsilon(e)+b>2 부문의 (e,t) 좌표에서 F_t=F_s의 위상·밀도 공액 주기 도메인을 공급한다. 전체 F_tot=direct-integral F_t는 (e,b)에서 F_s+i epsilon_prime partial_b다. 끝점은 고정 t에서 이어 b_upper=b_lower-alpha다.'
    conditional_result: '[정리: 조건부] 야코비안1인 좌표변환과 주기 미분의 직접적분 도메인에서 F_tot은 자기수반이고 H_tot/E_star=M_t와 강하게 가환한다. F_tot의 영 스펙트럼 사영 A_tot과 기록 U=A_tot tensor I+(I-A_tot) tensor X는 둘 모두와 강하게 가환한다.'
    preparation: '정규화 chi in L2(t>2)에 대해 Psi_chi=j_F(e)chi(epsilon+b)는 양의 배터리 상태이며 F_tot=0이다. 유한 구간 지지의 H1 chi에는 내부 미분식 F_s^loc Psi=-i epsilon_prime j_F chi_prime(t)가 비영이다. 이는 원래 자기수반 F_s의 작용이 아니다.'
    domain_boundary: '원래 고정 b 주기 도메인은 chi(1+b)=chi(1+alpha+b)를 요구한다. alpha>0의 반직선 주기성을 만족하는 L2 chi는0뿐이므로 비영 상관 준비는 그 도메인 밖이다. 에너지별 이동 접합을 갖는 F_tot의 도메인과 구별한다.'
    distinction: '곱 준비의 원래 F_s 사영 누설 O(W^-2)와 상관 준비의 F_tot 누설0을 구별한다. F_tot 영모드에서 기록 라벨0의 확률은1이다. 이는 물리적 결과 선택 법칙이나 원래 F_s·사후 c의 보존 증명이 아니다.'
  proof: 'derivations/Q-0020/conditional_composition.derivation.md#기록의-사전-제약-누설과-장치-포함-제약'
  numerical_results:
