    - '[공리: 검증 모형] 평탄 길이 측도 dy와 균등 또는 지정한 디리클레 다항 준비를 공급한다. 미시적 준비·방출·환경의 유도가 아니다.'
    - '[공리: 검증 모형] 역제거는 직전 생성의 제약면에 제한한다. 일반적인 전방 3→2나 임의 새 상태 전체의 단위 역과 동일시하지 않는다.'
