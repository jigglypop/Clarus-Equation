    - 'Delta s=beta*[pi*(A_012+A_034+A_134+A_234)-sum_{t subset (01234)} A_t*theta_t]. 새 단체의 경계 작용에서 기존 경계 삼각형 여섯 개의 pi*A_t 항을 뺀다.'
    - '고정 기존 기하의 새 섬유에서 J_chi psi(y)=exp(i Delta s(y))*chi(y)*psi, int |chi|^2 dy=1로 정의한다. 아래 제약 노름은 정규화 부모 입력에 대해 쓴다.'
  assumptions:
