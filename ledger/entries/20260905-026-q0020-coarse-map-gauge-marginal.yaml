regge_conservative_record:
  status: '[산출]'
  target_link: '접힘의 에너지 경로 보존에 필요한 조건부 기록을 구성하고, 장치 에너지 자원과 근사 오차를 함께 판정한다.'
  scope: '고정 대칭 z의 공동 조건부 사영 P와 두 공동측도, 공급 에너지 H_s/E_star=1+e/L을 사용한다. 수치는 h=1이다. 물리 시간·국소 미시작용·배터리 준비·0D 에너지 보충·힘의 통합을 유도한 것은 아니다.'
  definitions:
    - 'P는 공동 L2(mu)의 조건부 평균, Q=1-P다. 기록계 R=C^2, H_R=0, 판독 M=|0><0|, 배터리 H_b/E_star=b>=0, H_A=H_R+H_b를 공급한다. 초기 곱상태와 강한 총에너지 보존, [M,H_A]=0을 요구한다.'
    - 'N=U^dagger M U-P, eta(chi)^2=<N^2>, eta_sup=sup_chi eta(chi)다. eta는 무차원 RMS이며 확률과 다르다. 모든 공동 입력의 하한을 Ran(exp(i beta S)I)에만 제한한 최적 하한으로 옮기지 않는다.'
  conditional_results:
    - status: '[정리: 조건부]'
      claim: '각 섬유의 ||i[P,H_s/E_star]||는 epsilon의 조건부 표준편차다. 전체 상한 sigma_star^2는 길이 1/12, 제곱길이 1/18이며 공통 직사각형에서 달성된다. 교환자 최악 상태의 계 에너지 분산 v_star는 각각 7/60,9/100이다.'
