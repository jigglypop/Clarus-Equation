    - '[공리: 검증 모형] 단위 벡터 몫과 L^2(dQ)에서 exp(i S/hbar) 진동 양자화를 별도로 택한다. 물리 질량과 좌표 척도는 이 선택으로 정해지지 않는다.'
  conditional_results:
