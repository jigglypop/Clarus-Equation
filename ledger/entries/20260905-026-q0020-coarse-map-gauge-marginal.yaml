    convergence: '마지막 격자 최대 상대변화0.002965794243756241, 작용 배열과 개별 기하의 차이7.993605777301127e-15다. 직접 파동8대조의 공식 차이1.7659484985443896e-15, 유한 전체 블록8대조의 에너지 잔차5.655198531684391e-16이다.'
    adapted_continuum: 'alpha1에서 W2/8/32/128/512의 누설은0.19702234458604806/0.022791020129003997/0.001565427951505755/0.00009977925431835463/0.000006265326849029622이다. W512의 W^2 lambda=1.6424178415120212이며 점근 상수pi^2/6=1.6449340668482264다.'
    apparatus: '실제 작용 파동36차분의 총제약 잔차1.5602978241062808e-9, 계 단독 잔차0.3056267445596831--0.6300656749310596이다. 고정 b의 잘못된 경계 결함1.01465867667874--1.0329287188579808, 에너지에 맞춰 이동한 경계 결함0이다. 고정 t 유한 사영/제약 가환 잔차6.420215791079834e-16, 고유모드 잔차2.02e-15 이하를 확인했다.'
