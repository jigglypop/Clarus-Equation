  - status: "[정리: 조건부]"
    claim: "H/g=3I+사슬 인접행렬의 반무한 단일들뜸 모형에서 경계 진폭은 exp(-3i tau) J1(2tau)/tau이며 국소 생존확률은0으로 간다. 총 에너지와 들뜸은 보존된다."
