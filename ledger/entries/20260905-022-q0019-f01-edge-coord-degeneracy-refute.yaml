  $\\lambda_{\\max}^2=2/3$, $\\lambda_{\\rm iso}^2=1/6$) — 카드가 보고한 세 갈래 스펙트럼과
  $\\lambda_{\\max}>1$은 계량↔길이 좌표변환 $P$(조건수 $\\sqrt5$)의 켤레에서만 나타나는 좌표 인공물이다.
