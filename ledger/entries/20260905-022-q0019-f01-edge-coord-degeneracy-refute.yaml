  26장 Schur·flat section·내부 Hessian을 전혀 쓰지 않는 순수 조합 평균
  $d^G_{ij}=\\tfrac13\\sum_{a\\notin ij}d^{(a)}_{ij}$이며 regge 모듈 import가 없어 카드 본문의
  Schur-소거 서술이 장식적이다. survived: 차원·스펙트럼 재현·$S_5$ 표현론·recovers(궤도·코히런트·게이지)·
