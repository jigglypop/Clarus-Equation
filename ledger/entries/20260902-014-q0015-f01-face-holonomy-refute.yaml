claim: "F-01(예측식) 사다리 attempt 1: 14.2의 선언 계약 $\\theta=\\sqrt\\Delta$를 12.4의 정규화 simplicity
  잔차 $\\bar\\epsilon$에 붙여 $\\theta=c_\\theta\\bar\\epsilon/\\sqrt{1-\\bar\\epsilon^2}$,
  $c_\\theta=\\sqrt3/2$(단위 $\\Sigma_0$의 Gram $G_0=2\\det(e)\\mathbb 1_3$에서 정확)로 닫고, 그로부터
  '블록 잔차의 RG 지수 = 곡률 각의 RG 지수'(거듭제곱 1, 대안 거듭제곱 ½)를 주장한다. 12.1 attachment 규칙
  아래 모든 합성 face는 조부–부–자 3-chain이므로 face 커널 $\\|H_3\\kappa_fH_3\\|_F^2=10/9$(깊이·tree
  무관)이고 $\\rho_{\\rm face}=\\sqrt5/3$, 두 채널($\\theta_{\\rm iso}^2+\\theta_{\\rm mis}^2$) 분해로
  $\\theta_{\\rm mis}$만 예측한다고 선언한다. card-check PASS, verify 13/13 pass(symbolic pass, numeric
  pass), 예측 6·자유 파라미터 0·kill 7·사다리 7단으로 등록됐으나 adversary(opus, status=fail,
  severity=P0)가 refute를 권고했다: (1) `check_theta.py`가 같은 Gram에서 $\\epsilon$과
  $\\theta=1.5\\|{\\rm tl}\\,G\\|/{\\rm tr}\\,G$를 동시에 계산할 뿐 blk·face·scale 어느 mode에도 평행운반·
  연결·홀로노미가 없다 — $\\theta$는 $\\epsilon$의 고정 결정함수(상대오차 4e-16)이고 '거듭제곱 1 vs ½'
  판별은 스크립트에 하드코딩되어 있으며 대안 0.2651은 실제로는 P4 값의 절반일 뿐이다. (2) 카드가 쓰는
  $\\Delta$(trace-정규화)는 14.2 구현의 $\\Delta$(절대 기준 $\\mathbb 1_3$)와 다른 양이다 — 순수 등각
  왜곡에서 구현 각은 0.381인데 카드 정규화는 1.3e-16을 준다; $c_\\theta=\\sqrt d/2$는 Plebanski 기하가
  아니라 Gram 첨자 차원 세기(d=2..6에서 확인)로 재현된다. (3) 10/9는 3-chain의 고유 성질이 아니다 — 형제
  face도 10/9, cousin face는 40/9이므로 3단의 '3-chain이라서'라는 논증은 오류이고 '$\\forall$tree
  보편성'은 12.1 규칙 조건부일 뿐이다. (4) 카드의 유일한 실질 숫자(K4)는 미선언 부호 규약에 의존한다 —
  12.1의 방향 있는 경계 $(+,+,-)$로 합하면 $\\rho_{\\rm face}=3.543$으로 창 $[0.685,0.806]$ 밖 약 4.7배다.
  (5) K1·K5·K6은 발동이 원리상 불가능한 항등식이고 K2·K7은 F-02가 이미 통과한 검정과 사실상 같은 것인데
  카드 predicts의 already_observed:false 표기는 F-02 result.json에 같은 규약 결과가 이미 있다는 사실과
  모순되며, K3는 사실상 결정된 값이라 실질적으로 반증력 있는 kill은 K4 하나뿐이다. (6) 4단 두 채널 분해는
  $\\theta_{\\rm iso}$가 정의도 계산도 되지 않은 공백으로 남는다. 살아남는 것: $\\theta^2(1-\\epsilon^2)
  =(3/4)\\epsilon^2$ 항등식(임의 SPD 3x3 Gram에서 항상 참), 10/9·2·$\\sqrt5/3$의 사전등록 재현, 조합론
  재계산 일치, smoke 이탈 3건은 독립 씨앗 재실행으로 잡음임을 확인, K3 face 깊이 무관성
  1.00084±0.00043, K4 $\\rho_{\\rm face}$ pooled 0.74001±0.0034(예측 0.745356 대비 -1.6σ), 사전등록
  무결(창·seed·tol 조작 없음; 다만 7단 '예측시험' 표기는 부정확하다 — 실제로는 F-02 지수를 그대로
  상속한 회귀검사이지 맹검 예측시험이 아니다). 곡률 홀로노미 각의 RG 지수가 잔차의 RG 지수와 같다는
  부모 주장(카드의 핵심 신규성)은 반증 가능한 곡률 예측으로서 무너진다. 살아남는 좁은 명제는 '12.1
  attachment 규칙·F-02 가우스 상속 라벨 모형 아래 3-cell 합성 face 블록합(부호 없는 합)의 중심화 커널은
  10/9로 조부 깊이·tree 무관, 12.4 잔차의 상속/i.i.d. RMS 비는 $\\sqrt5/3$(독립 24576+24576 표본
  0.74001±0.0034)'이며, 이는 곡률 카드가 아니라 Q-0008/F-02 사다리의 따름정리로 옮겨 닫는 것이 맞다."
