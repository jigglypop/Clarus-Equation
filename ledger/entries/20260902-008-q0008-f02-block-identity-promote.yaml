claim: "사다리 2단(정확 블록 항등식)을 강한 형태로 닫는다: 임의의 대칭 쌍선형 형식 T와 삼중항 {X_v}에
  대해 전제 없이 성립하는 평행축(König–Huygens) 항등식 T(ΣX,ΣX)=nΣ_vT(X_v,X_v)−nΣ_vT(X_v−X̄,X_v−X̄)에
  cell simplicity(tl gram X_v=0, 모든 v)만 대입하면 tl gram(Y)=−nΣ_v tl gram(η_v−η̄)가 모든 δ에서 정확히
  성립하고, 이는 기준점 Σ_0의 simplicity 여부(adversary c1 basepoint_inert, 최대 상대오차 6.3e−15)·polar
  정렬 순서(cell별 상이 SO(3))·가중치(무가중 13.2 규약뿐 아니라 n→W=Σw_v 일반화도 W≠0에서 성립, c1
  weighted_generalisation 1.15e−13)·signature(Euclid/Lorentz/혼합 블록, c2 최대 2.7e−15)·배향·라벨
  분포에 무관하다. 따름정리 (a) 두 종 결정론 Δ에서 ε=p(1−p)‖tl gram Δ‖_F/‖gram(Σ_0+(1−p)Δ)‖_F가 (pn
  정수·분모 비퇴화 조건에서) n에 무관하게 정확(13.5 n-무관성 재현, verify[6]); (b) 결함 cell 1개에서
  p(1−p)=(n−1)/n²로 정확히 희석된다(K4 일관성 검사 숫자 0.140625와 일치)."
