claim: "결합 모형 C=H_1+H_2+H_S+λ(T_2⊗σ_-^Q+h.c.) (Z_N 군평균 Π, (N,λ)∈{(8,3),(6,4),(24,5)})
  에서: λ≠0인 관측자2 임베딩 V_2는 등거리가 아니며 V_2†V_2/N은 H_phys 위 비균일 두-결과
  시계-2 읽기 POVM이다(Σ_τ V_2†V_2=N; 열린 경계 재유도에서도 Q_2≠1 생존, Smith–Ahmadi
  2019의 관찰과 부합). 결함 항등식 E_rel,b−E_kin,b=V_2†P_b(Q_2H_SQ_2−H_S)P_bV_2 (Q_2=V_2V_2†)
  는 임의의 선형사상 V·자기수반 H·사영 P에 대해 성립하는 항등식이며(무작위 V 5회, 잔차~1e-11),
  내용은 'A↦V†AV가 곱을 보존 ⟺ VV†=1'이라는 교과서 보조정리로 환원된다 — K8(b)는
  이를 넘는 독립 내용이 없다(E-20260902-001에서 이미 확인된 비준동형의 재발견). 관측자1·
  λ=0 준동형(K8a)은 생존한다. (N,λ)=(8,3),(6,4),(24,5)에서 관측된 정수 스펙트럼·{1±c}
  이분법은 시계 2의 순환 감김(mod-N) 인공물이다: 열린 경계에서는 모든 정수 λ에서 스펙트럼이
  정수이고 항상 {0,1,2}이며, 순환에서만 피타고라스 조건 (N/2)²+λ²=정수²로 세 점이 특별해진다
  (열린 경계 잔차~1e-14 vs 순환 잔차 0.06~0.47, N8_lam3/N6_lam4만 예외적으로 정수).
  K9는 gcd(1+λ,N)=1일 때 적색편이형 결합이 무내용이라는 좁은 보조정리로만 생존하며,
  gcd≠1을 결합의 필요조건으로 보는 원 문구는 기각된다(H_S가 이미 Dirac이어도 같은 결함이
  발생, gcd=2 사례에서 Delta_norm=3.0). 부모 (B) 문구('관측자 간 에너지 차이=Dirac X의
  기댓값')는 E^{(2)} 정규화 장부의 polarization 위반(0.10/0.31/0.023)으로 attempt-02
  (E-20260902-002)에 이어 재확인 기각된다. 영감 ②는 이번 결과로 지지도 반증도 되지 않는다
  (adversary inspiration2_verdict=무관)."
