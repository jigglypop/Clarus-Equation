claim: |
  공유 모형 C^16_T⊗C^10_g⊗C^7_r, H_g=diag(0,1,1,2,2,2,3,3,4,5), H_r=diag(0..6),
  C=Λ+H_g+H_r (mod 16), Π=(1/16)Σ_t e^{2πitC/16}, dim_kin=1120, dim_phys=70.
  (i) "제약이 Λ 섹터 위 측도를 고정하는가" — 기각. Π=Σ_k|k><k|⊗Q_{-k}는 껍질 제한이고
  물리 상태의 Λ 분포 p(Λ_k)=|χ̂_k|²‖Q_{-k}φ‖²/Z는 운동학적 상태를 그대로 상속한다
  (곱상태 60개 최대잔차 2.2e-16). 무작위 ψ_kin(비곱상태) 200개의 측도 벡터 수치 랭크=12=도달
  가능 섹터 수(유지 최소 특이값 0.169 vs 버린 최대 1.4e-16), d_k/70에서 최대 0.13 벗어난다 —
  제약이 고정하는 것은 지지집합(k=1..4 배제)과 물리 내적뿐, 측도 자체는 자유다. Λ는 고정-τ
  관계적 관측량 10개와 비교환(노름 2.18~2.88 ≫ SEP=1e-3; [A,H_g]=0 대각 A·τ-평균 관측량만
  ≤2.9e-15로 통근)이므로 초선택되지 않는다. N=16→32→64로 늘려도 d(E) 표·최빈값(6,6,6,7)·도달
  섹터(12)가 불변이다. 이 결론은 Henneaux–Teitelboim(1989)·Unruh–Wald(1989)·Kuchař(1991)·
  Smolin(2009)의 재발견으로 보이나, 이번 attempt는 sourcer를 실행하지 않아(반례 있음, 정책상
  스킵) 정리 번호 대조 없는 낮은 신뢰도의 진술이다.
  (ii) "관측자 존재 조건화가 인류원리 입력 없이 관측 Λ 근방 봉우리를 만드는가" — 이 모형
  언어로는 물음 자체가 성립하지 않는다(moot), "기각"이 아니다. 선택함수 f_k=Tr(EP_k)/d_k는
  비상수(ε=1..4에서 max_dev 0.78/0.66/0.56/0.53 ≫ SEP)이고 최빈 E*=6,6,6,7(동률 {6},{6,7},
  {6,7},{7}; 다중도판 B에서 ε=4가 7→6 이동, 조건화 평균은 모든 ε에서 0.2 이동, >SEP)이지만,
  사전등록 kill 2("봉우리가 표준 인류원리 입력 없이는 생기지 않아야 (ii) 반증")는 문자 그대로는
  발동하지 않는다 — 조건화가 전혀 없는 ε=0에서 이미 mode_E=5(동률 {5,6}), mean_E=5.3으로 봉우리가
  존재한다(모형 자체의 상태밀도 d(E)가 봉우리 형태이기 때문). prover는 판정 기준을 "봉우리 위치가
  ε에 의존해 이동하는가"로 바꾸어 (ii) 기각으로 적었다 — 이는 사전등록 기준의 사후 변경이며
  (assumptions에 명시), 정직성 규정상 "(ii) 기각"이 아니라 "물음 불성립(moot)"으로 정정한다.
  사전분포를 껍질 E=4/10/11에 얹으면 봉우리가 정확히 그 값에 고정되고 ε와 무관하다
  (phi_on_shell_E4=[4,4,4,4] 등) — 봉우리 위치는 (i)에서 확인된 측도 자유(C1)의 산물일 뿐,
  독립적으로 확인되거나 반증되는 사실이 아니다.
  C2(부수): Haar 사전평균 p(Λ_k)=d_k/70(잔차 1.5e-16), Lüders 조건화 p(Λ_k|E)=Tr(EP_k)/
  ΣTr(EP_j)(잔차 2.5e-16)로 Page 관측자 계수 측도와 일치하나, [E,Π]≠0인 결합-드레싱
  (θ=0.05~1.0)에서는 Page와 Lüders 최빈값이 갈라진다(θ=0.05, ε=2,3에서 mode_page=6 vs
  mode_lueders=7; ‖[E,Π]‖ 최대 0.37~0.50) — [E,Π]=0 가환 조건부로만 생존.
  종합: 표적 (i)는 유한 모형에서 정당하게 기각되어(문헌과 정합) 닫힌다. (ii)는 반증이 아니라
  (i)의 따름(moot)이며 원 문구가 결함이다. 재정식화(예: Λ 섹터 상태 선택 공리)는 이번 attempt의
  표적을 벗어나며 사용자 결정이 필요하다.
