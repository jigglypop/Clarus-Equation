# Permission policy for PolicyCell.
# Anything NOT in `allow` that triggers an external_action edge is
# downgraded to draft_only and requires human approval.

allow:
  # read-only / reversible tools that may auto-execute
  - search_web
  - read_file
  - get_calendar

require_approval:
  # side-effecting tools — always gated, listed for documentation
  - send_email
  - delete_file
  - deploy
  - transfer_funds

defaults:
  external_action_without_approval: draft_only
